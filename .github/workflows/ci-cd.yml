
name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos para publicar resultados de seguridad en GitHub
permissions:
  security-events: write

jobs:

  # ETAPA 1: Construcción de la imagen Docker
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vuln-app ./app

      - name: Save Docker Image as tar
        run: docker save vuln-app -o vuln-app.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuln-app-image
          path: vuln-app.tar

  # ETAPA 2: Análisis estático de código (SAST)
  SonarQube-SAST:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # PUERTA DE SEGURIDAD SAST:
        # Espera el resultado del Quality Gate.
        # Si está FAILED, este trabajo debe fallar.
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ETAPA 3: Análisis de vulnerabilidades de imagen y dependencias (SCA)
  Container-Image-Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: vuln-app-image

      - name: Load image into Docker
        run: docker load -i vuln-app.tar

      # Genera el informe SARIF con todas las severidades
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: vuln-app
          format: sarif
          output: trivy-results.sarif
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: 0

      # PUERTA DE SEGURIDAD SCA:
      # Bloquea el trabajo si encuentra vulnerabilidades CRITICAL
      - name: Block pipeline if CRITICAL vulnerabilities exist
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: vuln-app
          format: table
          severity: 'CRITICAL'
          exit-code: 1

      # Publica el informe en la sección de seguridad de GitHub
      - name: Upload results to GitHub security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ETAPA 4: Análisis dinámico de la aplicación (DAST)
  ZAP-DAST:
    runs-on: ubuntu-latest
    needs: [SonarQube-SAST, Container-Image-Scan]
    if: always()
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: vuln-app-image

      - name: Load image into Docker
        run: docker load -i vuln-app.tar

      # Inicia la aplicación vulnerable para realizar el análisis
      - name: Start vulnerable app
        run: docker run -d --name vuln-app --network host vuln-app

      # Comprueba que la aplicación esté disponible antes del escaneo
      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to become available on port 8000..."
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200"; then
              echo "App is up on attempt $i!"
              exit 0
            fi
            echo "Attempt $i/15 — not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "App never became available. Container logs:"
          docker logs vuln-app
          exit 1

      # PUERTA DE SEGURIDAD DAST:
      # Configura el escaneo para reportar alertas de severidad HIGH
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:8000'
          fail_action: 'true'
          allow_issue_writing: false
          cmd_options: '-j'

      # Guarda el informe HTML como artefacto de GitHub Actions
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
